services:
  web:
    build: .
    image: softvence/pulse_ai:latest
    container_name: pulse_ai_web
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8002:8000"
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pulse_net

volumes:
  app_data:

networks:
  pulse_net:
    driver: bridge
