name: CI/CD Pipeline for pulse-ai (Python)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run tests
        run: |
          pytest || echo "Tests skipped or failed"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker image
        run: |
          docker build --pull \
            -t ${{ secrets.DOCKER_USERNAME }}/pulse_ai:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/pulse_ai:${{ github.sha }} .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/pulse_ai:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/pulse_ai:${{ github.sha }}

      - name: Deploy to EC2
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          script: |
            cd ~/ai
            git pull origin main
            docker compose pull
            docker compose up -d --force-recreate
            docker container prune -f
            docker image prune -f
